services:
  checkout-adm:
    image: mysql:8.0.29
    restart: unless-stopped
    hostname: checkout-adm
    container_name: checkout-adm
    environment:
      TZ: "America/Sao_Paulo"
      MYSQL_ROOT_PASSWORD: "root"
    ports:
      - "3307:3306"
    volumes:
      - ./checkout/mysql/config:/scripts/config
      - ./checkout/mysql/use-case:/scripts/use-case
      - ./checkout/mysql/migration:/scripts/migration
      - ./checkout/mysql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  transaction-adm:
    image: mysql:8.0.29
    restart: unless-stopped
    hostname: transaction-adm
    container_name: transaction-adm
    environment:
      TZ: "America/Sao_Paulo"
      MYSQL_ROOT_PASSWORD: "root"
    ports:
      - "3306:3306"
    volumes:
      - ./transaction/src/main/resources/db/mysql/config:/scripts/config
      - ./transaction/src/main/resources/db/mysql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  transaction:
    build:
      context: transaction
      dockerfile: Dockerfile
    restart: always
    hostname: transaction
    container_name: transaction
    env_file:
      - transaction/config/configs.env
    ports:
      - "8084:8084"
    volumes:
      - ./transaction/src/main/resources/kafka/schemas:/opt/application/kafka/schemas
      - ./transaction/src/main/resources/kafka/connectors:/opt/application/kafka/connectors
    depends_on:
      broker:
        condition: service_healthy
        restart: true
      transaction-adm:
        condition: service_healthy
        restart: true
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.5
    restart: unless-stopped
    hostname: zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_SERVER_ID: "1"
      ZOOKEEPER_TICK_TIME: "2000"
      ZOOKEEPER_CLIENT_PORT: "2181"
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD-SHELL", "bash -ec 'echo > /dev/tcp/127.0.0.1/2181'" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  broker:
    image: confluentinc/cp-kafka:7.9.5
    restart: always
    hostname: broker
    container_name: broker
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9000,PLAINTEXT_HOST://0.0.0.0:9001"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:9000,PLAINTEXT_HOST://localhost:9001"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      zookeeper:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [ "CMD-SHELL", "cub kafka-ready -b localhost:9000 1 60" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.5
    restart: always
    hostname: schema-registry
    container_name: schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_AVRO_COMPATIBILITY_LEVEL: "forward_transitive"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://broker:9000"
    ports:
      - "8081:8081"
    depends_on:
      broker:
        condition: service_healthy
        restart: true
      zookeeper:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [ "CMD-SHELL", "cub sr-ready localhost 8081 60" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-connect:
    image: debezium/connect:1.9.7.Final
    restart: always
    hostname: kafka-connect
    container_name: kafka-connect
    environment:
      GROUP_ID: "1"
      HEAP_OPTS: "-Xmx256m"
      KEY_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      BOOTSTRAP_SERVERS: "broker:9000"
      CONFIG_STORAGE_TOPIC: "kafka.connect.config"
      OFFSET_STORAGE_TOPIC: "kafka.connect.offsets"
      STATUS_STORAGE_TOPIC: "kafka.connect.status"
      INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    ports:
      - "8083:8083"
    depends_on:
      broker:
        condition: service_healthy
        restart: true
      schema-registry:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent --show-error http://localhost:8083/connectors >/dev/null || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.9.5
    restart: always
    hostname: control-center
    container_name: control-center
    ports:
      - "9021:9021"
    environment:
      PORT: 9021
      CONTROL_CENTER_CONNECT_CLUSTER: "http://kafka-connect:8083"
      CONTROL_CENTER_BOOTSTRAP_SERVERS: "broker:9000"
      CONTROL_CENTER_ZOOKEEPER_CONNECT: "zookeeper:2181"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONTROL_CENTER_LOG4J_ROOT_LOGLEVEL: "ERROR"
      CONTROL_CENTER_TOOLS_LOG4J_LOGLEVEL: "ERROR"
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
    depends_on:
      broker:
        condition: service_healthy
        restart: true
      zookeeper:
        condition: service_healthy
        restart: true
      kafka-connect:
        condition: service_healthy
        restart: true
      schema-registry:
        condition: service_healthy
        restart: true
    links:
      - broker
      - zookeeper
      - kafka-connect
      - schema-registry
    healthcheck:
      test: [ "CMD-SHELL", "cub control-center-ready localhost 9021 90" ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
